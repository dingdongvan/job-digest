[project]
name = "job-digest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xtopher Chan", email = "dingdongvan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
]

[project.scripts]
job-digest = "job_digest:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
